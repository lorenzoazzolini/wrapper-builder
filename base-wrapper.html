<!-- File: base-wrapper.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrapper Generator</title>
    <!-- Richiama il CSS Condiviso -->
    <link rel="stylesheet" href="assets/ui-style.css">
    <style>
        .copy-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; margin-bottom: 20px; }
        .copy-buttons button { margin: 0; }
        .footer-btn { background-color: #6c757d; }
        .footer-btn:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION -->
    <div class="top-nav">
        <a href="index.html" class="brand">WRAPPER GENERATOR</a>
        <a href="index.html" class="nav-link">Templates Gallery</a>
    </div>

    <div class="app-main">
        <!-- CONTROL PANEL -->
        <div class="sidebar">
            <h2>Base Wrapper</h2>
            
            <!-- 1. LOGO + FAVICON -->
            <h3>Logo + Favicon</h3>
            <div class="form-group">
                <label>Logo URL</label>
                <input type="text" id="val_logo" value="https://via.placeholder.com/200x75.png?text=Your+Logo+Here">
            </div>
            <div class="form-group">
                <label>Logo Sizing Mode</label>
                <select id="val_logoMode">
                    <option value="width">Set Width (Height auto)</option>
                    <option value="height">Set Height (Width auto)</option>
                </select>
            </div>
            <div class="form-group"><label>Size (px)</label><input type="number" id="val_logoSize" value="200"></div>
            
            <!-- NUOVO ALLINEAMENTO LOGO -->
            <div class="form-group">
                <label>Logo Alignment</label>
                <select id="val_logoAlign">
                    <option value="left" selected>Left</option>
                    <option value="center">Center</option>
                    <option value="right">Right</option>
                </select>
            </div>
            
            <div class="form-group"><label>Favicon URL</label><input type="text" id="val_favicon" placeholder="https://.../favicon.ico"></div>

            <!-- 2. COLOR -->
            <h3>Color</h3>
            <div class="form-group"><label>Header Background</label><input type="color" id="val_headerBg" value="#ffffff"></div>
            <div class="form-group"><label>Gen Wrapper Color</label><input type="color" id="val_wrapperBg" value="#ffffff"></div>
            <div class="form-group"><label>Sidebar Background</label><input type="color" id="val_sidebarBg" value="#ffffff"></div>
            <div class="form-group"><label>Progress Bar Background</label><input type="color" id="val_progressBarBg" value="#dddddd"></div>
            
            <div class="form-group"><label>Accent Color</label><input type="color" id="val_accentColor" value="#1eaf90"></div>
            <div class="form-group"><label>Button Background</label><input type="color" id="val_btnColor" value="#ff0000"></div>
            <div class="form-group"><label>Button Text Color</label><input type="color" id="val_btnTextColor" value="#ffffff"></div>
            
            <div class="form-group"><label>Main Title Color (entry-title)</label><input type="color" id="val_titleColor" value="#000000"></div>
            <div class="form-group"><label>Main Text Color</label><input type="color" id="val_descColor" value="#333333"></div>
            <div class="form-group"><label>Sidebar Title Color (H4)</label><input type="color" id="val_sidebarH4Color" value="#000000"></div>
            <div class="form-group"><label>Sidebar Base Text</label><input type="color" id="val_sidebarTextColor" value="#333333"></div>
            <div class="form-group"><label>Footer Background</label><input type="color" id="val_footerBg" value="#ffffff"></div>

            <!-- 3. TYPO -->
            <h3>Typo</h3>
            <div class="form-group">
                <label>Font Import HTML (Google, Typekit...)</label>
                <textarea id="val_fontImport" rows="2" placeholder="Paste <link> or <style>..."><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet"></textarea>
            </div>
            <div class="form-group"><label>Heading + Button Font Rule</label><input type="text" id="val_headingFont" value="'Montserrat', sans-serif"></div>
            <div class="form-group"><label>Body Font Rule</label><input type="text" id="val_bodyFont" value="'Roboto', sans-serif"></div>
            
            <div class="form-group checkbox-group"><input type="checkbox" id="val_titleUppercase"><label>Title Uppercase</label></div>
            <div class="form-group checkbox-group"><input type="checkbox" id="val_titleBold" checked><label>Title Bold</label></div>
            <div class="form-group checkbox-group"><input type="checkbox" id="val_btnUppercase"><label>Button Uppercase</label></div>
            <div class="form-group checkbox-group"><input type="checkbox" id="val_btnBold" checked><label>Button Bold Text</label></div>

            <!-- 4. SHAPE / BORDER -->
            <h3>Shape / Border</h3>
            <div class="form-group"><label>Sidebar Radius (px)</label><input type="number" id="val_sidebarRadius" value="12"></div>
            <div class="form-group"><label>Button Radius (px)</label><input type="number" id="val_btnRadius" value="4"></div>
            <div class="form-group"><label>Progress Bar Radius (px)</label><input type="number" id="val_progressRadius" value="4"></div>
            <div class="form-group checkbox-group"><input type="checkbox" id="val_shadow" checked><label>Show Sidebar Shadow</label></div>
            <div class="form-group"><label>Bottom Border Thickness (px)</label><input type="number" id="val_borderWidth" value="10"></div>

            <!-- 5. LAYOUT -->
            <h3>Layout</h3>
            <div class="form-group">
                <label>Mobile Form Position</label>
                <select id="val_mobileSidebarPos">
                    <option value="bottom" selected>Bottom (After text)</option>
                    <option value="top">Top (Before text)</option>
                </select>
            </div>
            <div class="form-group checkbox-group"><input type="checkbox" id="val_showMobileBtn"><label>Mobile Button "Go to sign"</label></div>

            <!-- 6. HIDE / SHOW -->
            <h3>Hide / Show</h3>
            <div class="form-group checkbox-group"><input type="checkbox" id="val_showTitle" checked><label>Show Petition Title</label></div>
            <div class="form-group checkbox-group"><input type="checkbox" id="val_showH4" checked><label>Show Form Title (H4)</label></div>
            <div class="form-group checkbox-group"><input type="checkbox" id="val_showInfo"><label>Show Action Info</label></div>
            <div class="form-group checkbox-group"><input type="checkbox" id="val_showSosha"><label>Add Sosha Tracking Link</label></div>
            
            <hr style="width:100%; border:0; border-top:1px solid #ccc; margin: 10px 0;">
            
            <div class="form-group checkbox-group"><input type="checkbox" id="val_showFooter" checked><label>Show Footer</label></div>
            <div class="form-group" id="footerTextGroup">
                <label>Footer Text / HTML</label>
                <textarea id="val_footerText" rows="3">© 2026 Your Organization. All rights reserved.</textarea>
            </div>

            <div class="copy-buttons">
                <button id="btnCopyHeader">📋 Copy HEADER Code</button>
                <button id="btnCopyFooter" class="footer-btn">📋 Copy FOOTER Code</button>
            </div>
        </div>

        <div class="preview-area">
            <div class="preview-header">
                <strong>Live Preview</strong>
                <p>Base Wrapper</p>
            </div>
            <iframe id="previewFrame"></iframe>
        </div>
    </div>

    <script src="assets/common.js"></script>
    <script>
        function generateHeaderCode(values) {
            const faviconHtml = values.favicon ? `<link rel="icon" href="${values.favicon}">` : '';
            const soshaHtml = values.showSosha ? `<script src="https://app.sosha.ai/tracker.min.js?platform=actionnetwork" data-reload="true"><\/script>` : '';
            
            const logoWidth = values.logoMode === 'width' ? values.logoSize + 'px' : 'auto';
            const logoHeight = values.logoMode === 'height' ? values.logoSize + 'px' : 'auto';

            const actionInfoDisplay = values.showInfo ? 'block' : 'none';
            const titleDisplay = values.showTitle ? 'block' : 'none';
            const h4Display = values.showH4 ? 'block' : 'none';
            const shadowValue = values.shadow ? '0 2px 6px 0 rgba(0, 0, 0, 0.1), 0 2px 6px 0 rgba(0, 0, 0, 0.1)' : 'none';
            
            const mobileSidebarOrder = values.mobileSidebarPos === 'top' ? '-1' : '99';
            const mobileSidebarMargin = values.mobileSidebarPos === 'top' ? '50px' : '0px';

            const titleTransform = values.titleUppercase ? 'uppercase' : 'none';
            const titleWeight = values.titleBold ? '700' : 'normal';
            const btnTransform = values.btnUppercase ? 'uppercase' : 'none';
            const btnWeight = values.btnBold ? '700' : 'normal';

            const mobileBtnHtml = values.showMobileBtn ? `<div class="mobile-sign-wrap"><a href="#can_sidebar" class="mobile-sign-btn">Sign the Petition</a></div>` : '';

            return `<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en-US">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    ${faviconHtml}
    ${soshaHtml}
    
    ${values.fontImport}
    
    <style type="text/css">
        :root {
            --heading-font: ${values.headingFont};
            --body-font: ${values.bodyFont};
            
            --logo-align: ${values.logoAlign};
            --header-bg: ${values.headerBg};
            --wrapper-bg: ${values.wrapperBg};
            --btn-color: ${values.btnColor};
            --btn-text-color: ${values.btnTextColor};
            --accent-color: ${values.accentColor};
            
            --sidebar-bg: ${values.sidebarBg};
            --progress-bar-bg: ${values.progressBarBg};
            
            --sidebar-radius: ${values.sidebarRadius}px;
            --btn-radius: ${values.btnRadius}px;
            --progress-radius: ${values.progressRadius}px;
            --border-width: ${values.borderWidth}px;
            --sidebar-shadow: ${shadowValue};
            
            --title-transform: ${titleTransform};
            --title-weight: ${titleWeight};
            --btn-transform: ${btnTransform};
            --btn-weight: ${btnWeight};

            --action-info-display: ${actionInfoDisplay};
            --title-display: ${titleDisplay};
            --h4-display: ${h4Display};

            --sidebar-mobile-order: ${mobileSidebarOrder};
            --sidebar-mobile-margin: ${mobileSidebarMargin};
            
            --title-color: ${values.titleColor};
            --desc-color: ${values.descColor};
            --sidebar-h4-color: ${values.sidebarH4Color};
            --sidebar-text-color: ${values.sidebarTextColor};
        }

        body { font-family: var(--body-font); font-weight: 400; font-style: normal; margin: 0; }
        
        #gen_header { padding: 20px 0; background-color: var(--header-bg); }
        #gen_header img { width: ${logoWidth} !important; height: ${logoHeight} !important; max-width: 100%; display: inline-block; }
        
        .gen_wrapper { padding: 20px 20px; width: 1160px; max-width: 100%; margin: auto; box-sizing: border-box; background-color: var(--wrapper-bg); }
        
        .gen_wrapper #can_embed_form input[type="submit"], .can_embed-html #can_embed_form input[type="submit"],
        .gen_wrapper #can_embed_form .button, .can_embed-html #can_embed_form .button,
        .gen_wrapper #donate_auto_modal input[type="submit"], .can_embed-html #donate_auto_modal input[type="submit"],
        .gen_wrapper #donate_auto_modal .button, .can_embed-html #donate_auto_modal .button {
            font-family: var(--heading-font) !important; background-color: var(--btn-color) !important; color: var(--btn-text-color) !important;
            padding: 12px 15px !important; font-size: 18px !important; 
            font-weight: var(--btn-weight) !important; text-transform: var(--btn-transform) !important;
            border-radius: var(--btn-radius) !important; border: none !important;
        }
        
        .gen_wrapper #can_embed_form input[type="submit"]:hover, .can_embed-html #can_embed_form input[type="submit"]:hover,
        .gen_wrapper #can_embed_form .button:hover, .can_embed-html #can_embed_form .button:hover { opacity: .8; }
        
        .gen_wrapper #can_embed_form .action_status_running_total, .can_embed-html #can_embed_form .action_status_running_total,
        .gen_wrapper .gen_name, .gen_wrapper a, #can_fundraising_widget a, .ticketed_event a { color: var(--accent-color); text-decoration: none; }
        .gen_wrapper a:hover, #can_fundraising_widget a:hover, .ticketed_event a:hover { opacity: .7; }

        .gen_body > .gen_wrapper.layout--reverse #can_embed_form > .clearfix, .gen_body > .gen_wrapper.layout--equal #can_embed_form > .clearfix, .gen_body > .gen_wrapper.layout--full #can_embed_form > .clearfix { align-items: flex-start; display: flex; flex-flow: row wrap; }
        .gen_body > .gen_wrapper.layout--reverse #can_embed_form > .clearfix .can_thank_you-block, .gen_body > .gen_wrapper.layout--equal #can_embed_form > .clearfix .can_thank_you-block, .gen_body > .gen_wrapper.layout--full #can_embed_form > .clearfix .can_thank_you-block { width: 100%; }
        .gen_body > .gen_wrapper.layout--reverse #can_embed_form > .clearfix #can_main_col #action_info .action_owner_box { float: none; margin-right: 0; width: 100%; }

        @media (min-width: 768px) {
            .gen_body > .gen_wrapper.layout--reverse #can_embed_form > .clearfix, .gen_body > .gen_wrapper.layout--equal #can_embed_form > .clearfix, .gen_body > .gen_wrapper.layout--full #can_embed_form > .clearfix { flex-flow: row nowrap; }
            .gen_body > .gen_wrapper.layout--reverse #can_embed_form > .clearfix #can_sidebar, .gen_body > .gen_wrapper.layout--equal #can_embed_form > .clearfix #can_sidebar { margin-left: auto; width: 48%; }
            .gen_body > .gen_wrapper.layout--equal #can_embed_form > .clearfix #can_main_col { width: 48%; margin-bottom: 0; }
            .can_embed #can_embed_form > .clearfix, .can_embed #can_embed_form > div > .clearfix { flex-flow: row nowrap; }
            .can_embed #can_embed_form > .clearfix #can_sidebar { width: 48%; }
            .can_embed #can_embed_form > .clearfix #can_main_col { width: 48%; margin-bottom: 0; }
        }
        
        .can_embed #can_embed_form > .clearfix, .can_embed #can_embed_form > div > .clearfix { align-items: flex-start; display: flex; flex-flow: row wrap; }
        .can_embed #can_embed_form > .clearfix #can_sidebar { margin-left: auto; width: 100%; }
        .can_embed #can_embed_form > .clearfix #can_main_col { width: 100%; margin-bottom: 2rem; }
        
        .entry-title { 
            font-family: var(--heading-font) !important; display: var(--title-display) !important; 
            font-weight: var(--title-weight) !important; text-transform: var(--title-transform) !important;
            color: var(--title-color) !important;
        }
        
        .action_description, #can_main_col p { color: var(--desc-color) !important; }
        
        #can_sidebar h4, .action_sidebar h4 { 
            font-family: var(--heading-font) !important; display: var(--h4-display) !important; color: var(--sidebar-h4-color) !important;
        }
        
        #can_sidebar, .action_sidebar, #can_sidebar p, #can_sidebar label { color: var(--sidebar-text-color) !important; }
        
        #action_info { display: var(--action-info-display) !important; }
        #action_welcome_message_inner { background-color: transparent !important; }

        #can_sidebar { 
            background-color: var(--sidebar-bg) !important; border-radius: var(--sidebar-radius) !important; 
            border-bottom: solid var(--accent-color) var(--border-width) !important; box-shadow: var(--sidebar-shadow) !important; 
        }
        
        .action_sidebar { padding: 1.5rem !important; }
        
        #can_embed_form .action_status_tracker .action_status_status_bar, .action_status_status_bar { 
            background-color: var(--progress-bar-bg) !important; height: 20px !important; border-radius: var(--progress-radius) !important;
        }
        span.action_status_status_bar-grow { 
            background-color: var(--accent-color) !important; height: 20px !important; border-radius: var(--progress-radius) !important;
        }
        .action_status_running_total { font-weight: 700 !important; }

        .mobile-sign-wrap { display: none; background: #fff; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 999; }
        .mobile-sign-btn { 
            display: block; width: 100%; text-align: center; box-sizing: border-box; text-decoration: none;
            background-color: var(--btn-color); color: var(--btn-text-color); padding: 12px;
            font-family: var(--heading-font); font-weight: var(--btn-weight); text-transform: var(--btn-transform);
            border-radius: var(--btn-radius);
        }

        @media (max-width: 767px) {
            .mobile-sign-wrap { display: block; }
            #can_embed_form > .clearfix, #can_embed_form > div > .clearfix { display: flex !important; flex-direction: column !important; }
            #can_sidebar { order: var(--sidebar-mobile-order) !important; margin-bottom: var(--sidebar-mobile-margin) !important; }
        }
    </style>
</head>
<body class="gen_body">
    <div id="gen_header">
        <div class="gen_wrapper" style="text-align: var(--logo-align); background-color: transparent;">
            <img src="${values.logo}" alt="Organization Logo"/> 
            <h1 class="gen_name"></h1>
        </div>
    </div>
    ${mobileBtnHtml}
    <div class="gen_wrapper layout--equal">
    <!-- START WIDGET -->`;
        }

        function generateFooterCode(values) {
            if(!values.showFooter) return `    <!-- END WIDGET -->\n    </div>\n</body>\n</html>`;
            return `    <!-- END WIDGET -->
    </div> 
    
    <div id="gen_footer" style="background-color: ${values.footerBg}; padding: 30px 20px; margin-top: 40px; text-align: center; font-family: var(--body-font); border-top: 1px solid #eaeaea; color: var(--desc-color);">
        <div class="gen_wrapper" style="padding: 0; background-color: transparent; font-size: 14px;">
            ${values.footerText}
        </div>
    </div>
</body>
</html>`;
        }

        function getValues() {
            return {
                logo: document.getElementById('val_logo').value,
                logoMode: document.getElementById('val_logoMode').value,
                logoSize: document.getElementById('val_logoSize').value,
                logoAlign: document.getElementById('val_logoAlign').value,
                favicon: document.getElementById('val_favicon').value,
                headerBg: document.getElementById('val_headerBg').value,
                wrapperBg: document.getElementById('val_wrapperBg').value,
                sidebarBg: document.getElementById('val_sidebarBg').value,
                progressBarBg: document.getElementById('val_progressBarBg').value,
                accentColor: document.getElementById('val_accentColor').value,
                btnColor: document.getElementById('val_btnColor').value,
                btnTextColor: document.getElementById('val_btnTextColor').value,
                titleColor: document.getElementById('val_titleColor').value,
                descColor: document.getElementById('val_descColor').value,
                sidebarH4Color: document.getElementById('val_sidebarH4Color').value,
                sidebarTextColor: document.getElementById('val_sidebarTextColor').value,
                footerBg: document.getElementById('val_footerBg').value,
                fontImport: document.getElementById('val_fontImport').value,
                headingFont: document.getElementById('val_headingFont').value,
                bodyFont: document.getElementById('val_bodyFont').value,
                titleUppercase: document.getElementById('val_titleUppercase').checked,
                titleBold: document.getElementById('val_titleBold').checked,
                btnUppercase: document.getElementById('val_btnUppercase').checked,
                btnBold: document.getElementById('val_btnBold').checked,
                sidebarRadius: document.getElementById('val_sidebarRadius').value,
                btnRadius: document.getElementById('val_btnRadius').value,
                progressRadius: document.getElementById('val_progressRadius').value,
                borderWidth: document.getElementById('val_borderWidth').value,
                mobileSidebarPos: document.getElementById('val_mobileSidebarPos').value,
                showMobileBtn: document.getElementById('val_showMobileBtn').checked,
                showTitle: document.getElementById('val_showTitle').checked,
                showH4: document.getElementById('val_showH4').checked,
                showInfo: document.getElementById('val_showInfo').checked,
                showFooter: document.getElementById('val_showFooter').checked,
                footerText: document.getElementById('val_footerText').value,
                showSosha: document.getElementById('val_showSosha').checked,
                shadow: document.getElementById('val_shadow').checked
            };
        }

        window.updatePreview = function() {
            const values = getValues();
            document.getElementById('footerTextGroup').style.display = values.showFooter ? 'flex' : 'none';
            const headerHtml = generateHeaderCode(values);
            const footerHtml = generateFooterCode(values);
            
            const dummyForm = `
                <div id="can_embed_form">
                    <div class="clearfix">
                        <div id="can_main_col">
                            <h2 class="entry-title" style="margin-top:0;">Petition Campaign Title</h2>
                            <div class="action_description">
                                <p>This is the action description text. It uses the selected Body font. The title above uses your custom styling options (bold, uppercase, font family).</p>
                                <p>Resize the browser window to see the mobile button and layout changes in action!</p>
                            </div>
                            <div id="action_info" style="padding:10px; background:#eee; color:#333; margin-top:10px; margin-bottom:20px;">[Action Info] - Author / Sponsor text</div>
                        </div>
                        <div id="can_sidebar">
                            <div class="action_sidebar">
                                <h4 style="margin-top:0">Sign the petition here</h4>
                                <p style="font-size: 14px; margin-bottom: 15px;">Enter your details below.</p>
                                <input type="submit" value="Sign Now" style="cursor:pointer; width:100%;">
                                <div class="action_status_tracker">
                                    <div style="margin-top:20px; width:100%;" class="action_status_status_bar">
                                        <span class="action_status_status_bar-grow" style="display:block; width:50%;"></span>
                                    </div>
                                </div>
                                <a href="#" style="display:block; margin-top:10px;" class="action_status_running_total">1,500 Signatures reached!</a>
                            </div>
                        </div>
                    </div>
                </div>`;
            document.getElementById('previewFrame').srcdoc = headerHtml + dummyForm + footerHtml;
        }

        window.getCleanCode = function() { return generateHeaderCode(getValues()); }

        document.getElementById('btnCopyFooter').addEventListener('click', function() {
            const footerCode = generateFooterCode(getValues());
            navigator.clipboard.writeText(footerCode).then(() => {
                const btn = document.getElementById('btnCopyFooter');
                const originalText = btn.innerText;
                btn.innerText = "✅ FOOTER Copied!";
                btn.style.background = "#28a745";
                setTimeout(() => { btn.innerText = originalText; btn.style.background = "#6c757d"; }, 2000);
            });
        });
    </script>
</body>
</html>
